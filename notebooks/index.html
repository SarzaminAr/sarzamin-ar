<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Notebook AR</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<script defer src="./app.js?v=1"></script>

<link rel="stylesheet" href="./style.css">

</head>


<body>


<div id="status">
در حال آماده‌سازی دوربین...
</div>


<a-scene

mindar-image="
imageTargetSrc: ./targetsnot1.mind;
autoStart: true;
uiLoading: no;
uiScanning: no;
uiError: yes;
"

embedded

color-space="sRGB"

renderer="
colorManagement: true;
physicallyCorrectLights: true;
"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false">


<a-assets>


<video

id="notVideo"

src="./choromi/Not1.mp4"

preload="auto"

loop

muted

playsinline

webkit-playsinline>

</video>


</a-assets>



<a-camera

position="0 0 0"

look-controls="enabled: false">

</a-camera>



<a-entity

id="notTarget"

mindar-image-target="targetIndex:0">


<a-video

src="#notVideo"

width="1"

height="1.4"

position="0 0 0.01">

</a-video>


</a-entity>


</a-scene>


</body>

</html>
