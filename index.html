<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sarzamin AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- JavaScript -->
    <script defer src="app.js?v=62"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>

            <!-- ویدئوی اصلی با پس‌زمینه -->
            <video
                id="frontVideo"
                src="./front.mp4"
                preload="auto"
                loop
                muted
                playsinline
                webkit-playsinline>
            </video>

        </a-assets>


        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- TARGET FRONT -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <a-video
                id="frontARVideo"
                src="#frontVideo"
                width="1"
                height="1.0909"
                position="0 0 0">
            </a-video>

        </a-entity>


    </a-scene>

</body>
</html>
