<!DOCTYPE html>
<html lang="fa">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sarzamin AR</title>


    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.4.2/aframe.min.js">
    </script>


    <!-- MindAR -->
    <script
        src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
    </script>


    <!-- App JS -->
    <script
        defer
        src="app.js?v=107">
    </script>


    <style>

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

        }

        a-scene {

            width: 100%;
            height: 100%;

        }

    </style>

</head>


<body>


    <a-scene

        mindar-image="
            imageTargetSrc: ./targets.mind;
        "

        embedded

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

        renderer="colorManagement: true;"
    >


        <!-- ===================== -->
        <!-- ASSETS -->
        <!-- ===================== -->

        <a-assets>


            <!-- FRONT VIDEO -->

            <video

                id="frontVideo"

                src="./front.mp4"

                preload="auto"

                loop

                playsinline

                webkit-playsinline>

            </video>


            <!-- BACK VIDEO -->

            <video

                id="backVideo"

                src="./back.mp4"

                preload="auto"

                loop

                playsinline

                webkit-playsinline>

            </video>


        </a-assets>



        <!-- ===================== -->
        <!-- CAMERA -->
        <!-- ===================== -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>



        <!-- ===================== -->
        <!-- FRONT TARGET -->
        <!-- targetIndex 0 = جلو -->
        <!-- ===================== -->

        <a-entity

            mindar-image-target="
                targetIndex: 0
            ">


            <a-video

                id="frontARVideo"

                src="#frontVideo"

                width="1"

                height="1.0105"

                position="0 0 0">

            </a-video>


        </a-entity>



        <!-- ===================== -->
        <!-- BACK TARGET -->
        <!-- targetIndex 1 = پشت -->
        <!-- ===================== -->

        <a-entity

            mindar-image-target="
                targetIndex: 1
            ">


            <a-video

                id="backARVideo"

                src="#backVideo"

                width="1"

                height="1"

                position="0 0 0">

            </a-video>


        </a-entity>


    </a-scene>


</body>

</html>
