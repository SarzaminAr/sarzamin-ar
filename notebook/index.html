<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarzamin Notebook AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<link rel="stylesheet" href="style.css">

<style>
#soundButton {
    position: fixed;
    z-index: 9999;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 28px;
    border: none;
    border-radius: 14px;
    background: #111;
    color: white;
    font-size: 18px;
    font-weight: bold;
}
</style>

</head>

<body>

<button id="soundButton">
🔊 شروع AR با صدا
</button>


<a-scene

mindar-image="
imageTargetSrc: ./choromi/targets.mind;
autoStart: true;
"

renderer="
colorManagement: true;
alpha: true;
"

vr-mode-ui="enabled: false"

device-orientation-permission-ui="enabled: false"

>


<a-assets>

<video

id="frontVideo"

src="./choromi/choromi.mp4"

loop

playsinline

webkit-playsinline

preload="auto">

</video>

</a-assets>


<a-camera

position="0 0 0"

look-controls="enabled:false"

wasd-controls="enabled:false">

</a-camera>


<a-entity

mindar-image-target="targetIndex:0">


<a-video

src="#frontVideo"

position="0 0 0"

rotation="0 0 0"

width="1"

height="1.5">

</a-video>

</a-entity>


</a-scene>


<script src="app.js"></script>

</body>
</html>
